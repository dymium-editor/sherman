[package]
name = "sherman"
version = "0.1.0"
authors = ["Em Sharnoff <git@sharnoff.io>"]
edition = "2021"
repository = "https://github.com/dymium-editor/sherman"
license = "MIT OR Apache-2.0"
description = "Run-length encoded, highly-parameterizable balanced binary search tree"

[dependencies]
arbitrary = { version = "1.1.3", optional = true, features = ["derive"] }
serde = { version = "1", optional = true }

[features]
default = []
nightly = []
serde = ["dep:serde"]
fuzz = ["dep:arbitrary"]
